{% extends "base.html" %}
{% block title %}Check your email{% endblock %}
{% block content %}
<div class="form-card">
  <h1>Check your inbox</h1>
  <p class="subtitle">We sent a verification link to <strong>{{ email }}</strong>.</p>
  <p style="color:var(--text-muted); font-size:14px;">
    Click the link in that email to activate your account, then come back and log in.
  </p>
  <a href="{{ url_for('auth.login') }}" class="btn btn-block" style="margin-top:8px">Go to Login</a>
</div>
{% endblock %}
